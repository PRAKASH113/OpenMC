[package]
name = "openmc_b"
version = "0.1.0"
edition = "2024"
# Bevy 0.19 needs at least Rust 1.95+ — run `rustup update` if you're older.
rust-version = "1.98.1"

[dependencies]
# ── Bevy: the whole engine. Renderer, ECS, windowing, input, assets, UI,
#    and the logging system (bevy_log -> tracing).
#
#    Default features are ["2d", "3d", "ui", "audio"]. Steps 1 and 2 below
#    are both applied: `audio` and `2d` dropped, `3d` and `ui` kept. This was
#    done without a build to confirm it (see docs/IMPROVEMENTS.md,
#    2026-09-27) — build once and check the UI still draws (it's a `Camera2d`
#    under the hood; Step 2's comment explains why that should still work
#    without the `2d` feature) before trusting this further.
bevy = { version = "0.19", default-features = false, features = [
    "3d",
    "ui",
] }

# ── Step 1: drop audio — applied above. ───────────────────────────────────
#    `audio` pulls in `bevy_audio` plus `vorbis`, an Ogg decoder. The game
#    plays no sound and has no audio code at all, so all of it was compiled,
#    linked, and shipped for nothing.

# ── Step 2: also drop 2d — applied above. ─────────────────────────────────
#    `2d` exists for sprite-based games. This game spawns no `Sprite`, ever.
#
#    It looks safe despite the UI camera being a `Camera2d`: the Core2d render
#    pass lives in `bevy_core_pipeline`, which the `ui` feature already brings
#    in via `ui_bevy_render`, so the UI camera keeps working without `2d`.
#
#    The saving is smaller than the name suggests. `bevy_ui` depends on
#    `bevy_sprite` directly (for texture slicing), so `bevy_sprite` is
#    compiled either way — dropping `2d` only removes `bevy_sprite_render`.
#    Both points were read off the dependency graph rather than tested.
#
#    **Not yet confirmed by an actual build.** Give it one compile and check
#    the UI still draws before trusting this.

# ── Step 3 (bigger, riskier): 3d without glTF. Still NOT applied. ────────
#    The `3d` umbrella hardcodes `bevy_gltf` and `gltf_animation`. This game
#    loads no models — its meshes are generated in code — so that is a large
#    unused dependency. But `3d` cannot be kept while dropping glTF; the
#    sub-features (`3d_api`, `bevy_pbr`, `bevy_core_pipeline`, `bevy_render`,
#    `bevy_anti_alias`, `bevy_post_process`, ...) have to be listed by hand,
#    correctly, on the first try, with no build to check the list is
#    complete — left alone for exactly that reason. Worth doing once build
#    time actually hurts, with a build available to verify it.

# ── noise: procedural noise for terrain generation ────────────────────────
#    Not used by any code yet — `world::generation` is still the flat
#    placeholder floor — added ahead of that landing, since adding it here
#    already forces the one-time Bevy rebuild Step 1/2 above also needs, so
#    both are paid for in the same rebuild rather than two separate ones.
#    Default features only (no `images`; nothing here needs to dump noise to
#    a PNG).
noise = "0.9"

# ── Dev-only build speedup, not enabled here ─────────────────────────────
#    `bevy/dynamic_linking` links Bevy as a shared library so it is not
#    re-linked on every build. It is a large iteration win and must never
#    ship in release. Prefer passing it per-command rather than writing it
#    into this file:
#
#        cargo run --features bevy/dynamic_linking

# ── Faster iterative builds ──────────────────────────────────────────────
# Our own code is unoptimised so it compiles fast, while dependencies (Bevy,
# wgpu) get full optimisation — they are compiled once and then cached, so
# the cost is paid a single time. Without the second block, debug builds of a
# voxel game run at a few FPS because Bevy itself is unoptimised.
#
# NOTE for later: `opt-level = 0` is right while our code does almost nothing.
# Chunk meshing and terrain generation are tight numeric loops that commonly
# run 10-50x slower unoptimised, and they will be *our* code. Expect to raise
# this to 1 once they exist, and measure rather than guess.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin" # use "fat" for realeases
codegen-units = 1
strip = "symbols" # drops debug symbols; shrinks the binary a lot

# ── Lints ───────────────────────────────────────────────────────────────
[lints.rust]
unsafe_code = "deny"
# `unsafe_code = "deny"` is set as `#![deny(unsafe_code)]` in src/main.rs
# rather than a `[lints.rust]` table here. The table is valid Cargo, but the
# "Even Better TOML" extension (0.21.x) fails to follow the schema's
# cross-file reference for it and shows a false error. See main.rs for when to
# move it back.