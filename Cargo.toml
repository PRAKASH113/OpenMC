[package]
name = "openmc_b"
version = "0.1.0"
edition = "2024"
# Bevy 0.19 needs at least Rust 1.95+ — run `rustup update` if you're older.
rust-version = "1.98.1"

[dependencies]
# ── Bevy: the whole engine. Renderer, ECS, windowing, input, assets, UI,
#    and the logging system (bevy_log -> tracing). This single crate pulls in
#    everything you listed: 3D rendering + UI + logging.
bevy = "0.19"

# ── Faster iterative builds ──────────────────────────────────────────────
# Your own code compiles at opt-level 1 (fast to build, still tolerable to run),
# but all dependencies (Bevy, wgpu, etc.) get full optimization since you
# compile them once and then never again. Without this, debug builds of a
# voxel game run at ~2 FPS.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin" # use "fat" for realeases
codegen-units = 1
strip = "symbols" # drops debug symbols; shrinks the binary a lot


# ── Lints ───────────────────────────────────────────────────────────────
[lints.rust]
unsafe_code = "deny"